# \u4E2D\u8BBE\u7F6E\u6839\u65E5\u5FD7\u8BB0\u5F55\u5668\u7EA7\u522B\u4E3ADEBUG\uFF0C\u5E76\u6307\u5B9A\u4F7F\u7528\u63A7\u5236\u53F0\u548C\u6587\u4EF6\u9644\u52A0\u5668
log4j.rootLogger=DEBUG, CONSOLE, FILE

# \u914D\u7F6E\u63A7\u5236\u53F0\u8F93\u51FA
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1}:%L - %m%n
log4j.appender.CONSOLE.encoding=UTF-8

# \u914D\u7F6E\u6587\u4EF6\u8F93\u51FA - \u8F93\u51FA\u5230Tomcat\u7684logs\u76EE\u5F55
log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=${catalina.base}/logs/struts2demo.log
log4j.appender.FILE.MaxFileSize=10MB
log4j.appender.FILE.MaxBackupIndex=5
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1}:%L - %m%n
log4j.appender.FILE.encoding=UTF-8

# \u8BBE\u7F6EStruts2\u6846\u67B6\u7684\u65E5\u5FD7\u7EA7\u522B
log4j.logger.com.opensymphony.xwork2=INFO
log4j.logger.org.apache.struts2=INFO

# \u8BBE\u7F6E\u5E94\u7528\u7A0B\u5E8F\u7684\u8BE6\u7EC6\u65E5\u5FD7\u7EA7\u522B
log4j.logger.com.example=DEBUG
log4j.logger.com.example.action=DEBUG
log4j.logger.com.example.util=DEBUG

# \u51CF\u5C11\u7B2C\u4E09\u65B9\u5E93\u7684\u65E5\u5FD7\u566A\u97F3
log4j.logger.org.apache=WARN
log4j.logger.com.opensymphony=WARN
log4j.logger.httpclient=WARN

log4j.logger.freemarker=ERROR